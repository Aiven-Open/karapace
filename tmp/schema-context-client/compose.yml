# Schema linking PoC test bench: the same client scenario against several registries, one profile each.
#   karapace     : released Karapace (ghcr.io image), current behaviour without contexts
#   karapace-dev : Karapace built from the repository sources (current branch)
#   confluent    : Confluent Schema Registry community edition, reference registry with contexts
# All of them listen on localhost:18081: the Java client (client/) and its configuration do not change.
#
# Registry selection: COMPOSE_PROFILES in .env (karapace by default), or for a single command:
#   COMPOSE_PROFILES=confluent podman compose up -d
# Always run `podman compose down` before switching registry (empty registry, port 18081 released).

name: schema-context-client

services:
  kafka:
    image: docker.io/apache/kafka:${KAFKA_IMAGE_VERSION:-4.4.0}
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for the registry in the compose network, EXTERNAL for the client on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  karapace: &karapace
    profiles: ["karapace"]
    image: ghcr.io/aiven-open/karapace:${KARAPACE_IMAGE_VERSION:-6.2.4}
    hostname: karapace
    container_name: karapace
    command: ["python3", "-m", "karapace"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18081:8081"
    environment:
      KARAPACE_KARAPACE_REGISTRY: true
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_ADVERTISED_HOSTNAME: karapace
      KARAPACE_ADVERTISED_PROTOCOL: http
      KARAPACE_BOOTSTRAP_URI: kafka:29092
      KARAPACE_CLIENT_ID: karapace-0
      KARAPACE_GROUP_ID: karapace
      KARAPACE_MASTER_ELIGIBILITY: true
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_LOG_LEVEL: WARNING
    healthcheck:
      test: ["CMD", "python3", "healthcheck.py", "http://localhost:8081/_health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Same configuration as karapace, image built from the sources (repository root).
  # Rebuild after a code change: podman compose build karapace-dev
  karapace-dev:
    <<: *karapace
    container_name: karapace-dev
    profiles: ["karapace-dev"]
    image: localhost/karapace:dev
    build:
      context: ../..
      dockerfile: container/Dockerfile
      target: production
      args:
        KARAPACE_VERSION: ${KARAPACE_DEV_VERSION:-0.0.0.dev0+contexts}

  schema-registry:
    profiles: ["confluent"]
    image: docker.io/confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_IMAGE_VERSION:-8.4.1}
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      # Allows testing /mode IMPORT by hand.
      SCHEMA_REGISTRY_MODE_MUTABILITY: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
